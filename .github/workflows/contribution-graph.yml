name: Update Contribution Graph

on:
  # Update automatically every day
  schedule:
    - cron: "15 0 * * *"

  # Allows manual execution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_contribution_graph.py

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to contribution graph."
            exit 0
          fi

          git commit -m "chore: update contribution graph"
          git push
